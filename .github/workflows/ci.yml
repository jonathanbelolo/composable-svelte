name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `version:` input — action-setup reads `packageManager` from
      # package.json, and supplying both errors out when the strings differ
      # ("9" vs "9.0.0").
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Several packages and examples run their suites in a real browser.
      - name: Install Playwright browsers
        run: pnpm --filter @composable-svelte/core exec playwright install --with-deps chromium

      # Build first: `dist/` is gitignored, and every satellite and example
      # resolves @composable-svelte/core through the package `exports` map,
      # which points at dist. Typechecking or testing before the build fails
      # with TS2307 on a clean checkout.
      - name: Build
        run: pnpm -r build

      # Every workspace, not just core: the other seven packages and the
      # examples were never covered here, which is how a package could sit
      # broken (wrong vitest major, a watch-mode `test` script, a bad import)
      # without CI noticing.
      - name: Type check
        run: pnpm -r typecheck

      - name: Run tests
        run: pnpm -r test

      # `tsc` never reads .svelte, which is how a broken `spring.js` import and
      # 21 components with an undeclared `children` prop stayed invisible.
      # Errors gate; the a11y and unused-CSS warnings do not.
      - name: Svelte check
        run: pnpm --filter @composable-svelte/core check --threshold error
