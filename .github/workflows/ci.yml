name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `version:` input — action-setup reads `packageManager` from
      # package.json, and supplying both errors out when the strings differ
      # ("9" vs "9.0.0").
      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Several packages and examples run their suites in a real browser.
      - name: Install Playwright browsers
        run: pnpm --filter @composable-svelte/core exec playwright install --with-deps chromium

      # Build first: `dist/` is gitignored, and every satellite and example
      # resolves @composable-svelte/core through the package `exports` map,
      # which points at dist. Typechecking or testing before the build fails
      # with TS2307 on a clean checkout.
      - name: Build
        run: pnpm -r build

      # Every workspace, not just core: the other seven packages and the
      # examples were never covered here, which is how a package could sit
      # broken (wrong vitest major, a watch-mode `test` script, a bad import)
      # without CI noticing.
      - name: Type check
        run: pnpm -r typecheck

      # `--workspace-concurrency=1`: five of eight packages run vitest in real
      # browser mode, and pnpm's default is four workspaces at once. Chromium
      # instances then contend for the machine and suites fail on scheduling
      # rather than on code — which reads exactly like a flaky test and has been
      # chased as one more than once. `guides/VERIFICATION-PROTOCOL.md` rule 5
      # says run them sequentially; this is that rule, enforced where it counts.
      - name: Run tests
        run: pnpm -r --workspace-concurrency=1 test

      # `tsc` never reads .svelte, which is how a broken `spring.js` import, 21
      # components with an undeclared `children` prop, and a <button> nested in a
      # <button> all stayed invisible. Warnings gate too: the nested button was
      # reported for months as a warning while this step passed, because
      # `--threshold` only filters what is printed and never affected the exit
      # code. `--fail-on-warnings` is the flag that gates. The script carries it
      # so a local `pnpm check` matches CI.
      - name: Svelte check
        run: pnpm -r check

      # The browser half of the auth integration suite. Separate from `test`
      # because it boots two servers and drives a real browser; the Node half
      # (all 22 endpoints, every error arm) runs above with everything else.
      #
      # It is a *step*, not a manual script, because `examples/ssr-server` has
      # no `test` key and its Playwright suite has consequently never run here —
      # exactly the rot the rest of this file works to prevent. Chromium only:
      # that is all the install step above provides.
      - name: Auth integration (browser)
        run: pnpm --filter @composable-svelte/example-auth-server test:e2e
